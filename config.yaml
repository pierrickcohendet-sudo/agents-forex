    tradingview:     { url: "https://www.tradingview.com/markets/currencies/cross-rates-overview-heat-map/", type: html, actif: true }
    mataf:           { url: "https://www.mataf.net/fr/forex/tools/correlation", type: html, actif: true }
    # Sources news / géopolitique / décisions économiques (état du monde) :
    financialjuice:  { url: "https://www.financialjuice.com/home", type: html, actif: true,
                       selecteurs: '[class*="headline"]' }
    finviz:          { url: "https://finviz.com/", type: html, actif: true,
                       selecteurs: "a.nn-tab-link, a.tab-link-nw" }
    financialsource: { url: "https://financialsource.co/", type: html, actif: true }

rss:
