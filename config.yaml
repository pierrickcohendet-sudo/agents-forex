  investinglive: "https://www.forexlive.com/feed/news"   # InvestingLive (ex-ForexLive)

notion:
  actif: true
  page_parent_id: "https://www.notion.so/Rapports-FX-3ba65bc6466180128632c6715c31fc4a?source=copy_link"     # URL ou ID de la page parente (l'ID est extrait automatiquement)
  # ID de la base de données "Rapports FX" (une entrée par jour, vue Calendrier
  # à créer à la main dans Notion). Laisser vide : créée au premier run et l'ID
  # est écrit ici automatiquement, puis committé par le workflow.
  database_id: "f55a99e090404d419c8f594a96610fb7"

publication_web:
  actif: true
  dossier_docs: docs
  git_push: auto         # auto = pousse uniquement sous GitHub Actions ; toujours | jamais

# Mode --completer (remplissage progressif intra-journée) : ne relance jamais
# le scraping des 6 sites (cache 1 req/jour déjà garanti par core/scraping.py),
# ne retente que les devises/sections encore "analyse indisponible".
completer:
  # Dernier passage de la journée à ne pas dépasser — INFORMATIF seulement
  # (log une mention "dernier passage" au-delà), jamais un blocage : un lancement
  # manuel de test doit toujours pouvoir tourner, quelle que soit l'heure.
  heure_limite: "21:00"

chemins:
  donnees: data
