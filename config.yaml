# --- Valeurs manuelles (dossiers des engrenages) --------------------------------
# Pour les chiffres SANS source officielle gratuite accessible automatiquement (vérifié le
# 2026-10-11 : RBA et RBNZ refusent l'accès automatisé (403) ; BNS : séries arrêtées en 07/2025 ;
# Banque d'Angleterre : pas de 2 ans dans la base en ligne, seulement 5/10/20 ans).
# Chaque entrée : valeur (nombre, en %), date (AAAA-MM-JJ du relevé), source (nom exact + page).
# Laisser valeur: null tant qu'elle n'a pas été relevée À LA MAIN sur la source : le site affiche
# alors « n/d » avec la raison. Jamais de valeur devinée. Une valeur de plus de 10 jours est
# signalée « relevé ancien ».
valeurs_manuelles:
  rendement_2a:
    GBP: { valeur: null, date: null, source: "Bank of England — Yield curves, nominal 2 ans (bankofengland.co.uk/statistics/yield-curves)" }
    CHF: { valeur: null, date: null, source: "BNS — Rendements des obligations de la Confédération 2 ans (data.snb.ch)" }
    AUD: { valeur: null, date: null, source: "RBA — F2 Capital Market Yields, Government Bonds 2 ans (rba.gov.au/statistics)" }
    NZD: { valeur: null, date: null, source: "RBNZ — B2 Wholesale interest rates, 2 ans (rbnz.govt.nz/statistics)" }

# --- Devises suivies ---------------------------------------------------------
# paire        : symbole Twelve Data (null pour USD -> indice synthétique calculé).
# inverse      : true si la devise est au dénominateur de la paire
#                (USD/JPY : le JPY monte quand la paire baisse).
# ratio_rr     : ratio risque/récompense propre à l'actif — à ajuster par backtest.
# profil_risque: risque | refuge | neutre — détermine le biais Risk On/Off
#                structurel affiché (calculé en Python, plus jamais par le LLM).
devises:
  USD: { drapeau: "🇺🇸", banque_centrale: FED,  paire: null,     inverse: false, ratio_rr: 2.0, profil_risque: refuge }
  EUR: { drapeau: "🇪🇺", banque_centrale: BCE,  paire: EUR/USD,  inverse: false, ratio_rr: 2.0, profil_risque: neutre }
  GBP: { drapeau: "🇬🇧", banque_centrale: BOE,  paire: GBP/USD,  inverse: false, ratio_rr: 1.8, profil_risque: neutre }
  JPY: { drapeau: "🇯🇵", banque_centrale: BOJ,  paire: USD/JPY,  inverse: true,  ratio_rr: 2.2, profil_risque: refuge }
  CHF: { drapeau: "🇨🇭", banque_centrale: BNS,  paire: USD/CHF,  inverse: true,  ratio_rr: 2.0, profil_risque: refuge }
  CAD: { drapeau: "🇨🇦", banque_centrale: BoC,  paire: USD/CAD,  inverse: true,  ratio_rr: 1.8, profil_risque: risque }
  AUD: { drapeau: "🇦🇺", banque_centrale: RBA,  paire: AUD/USD,  inverse: false, ratio_rr: 2.0, profil_risque: risque }
  NZD: { drapeau: "🇳🇿", banque_centrale: RBNZ, paire: NZD/USD,  inverse: false, ratio_rr: 2.0, profil_risque: risque }
  # CNY : flottement dirigé (fixing quotidien PBoC + bande étroite). Paire
  # offshore USD/CNH utilisée (le CNH échange librement, le CNY onshore non).
  # Technique classique sous-pondérée -> voir ponderations_par_devise et
  # connaissances/cas_particuliers.md.
  CNY: { drapeau: "🇨🇳", banque_centrale: PBoC, paire: USD/CNH,  inverse: true,  ratio_rr: 1.5, profil_risque: neutre }

# --- Score de confluence (calculé en Python, JAMAIS choisi par le LLM) -------
ponderations:
  taux_directeur: 20
  cpi_surprise: 15
  yield_curve: 12
  vix: 10
  dxy: 10
  pmi_surprise: 10
  differentiel_taux: 8
  rsi: 8
  trendline: 7

# Pondérations spécifiques par devise (remplacent ENTIÈREMENT le bloc ci-dessus
# pour la devise concernée). CNY : le fixing et la politique PBoC dominent,
# la technique classique (RSI, trendline) est marginalisée — la PBoC borne le prix.
ponderations_par_devise:
  CNY:
    fixing_pboc: 22
    taux_directeur: 15
    cpi_surprise: 12
    pmi_surprise: 12
    dxy: 12
    differentiel_taux: 8
    yield_curve: 6
    vix: 6
    rsi: 4
    trendline: 3

# Biais macro global : écart de score moyen entre bloc risque et bloc refuge.
biais_global:
  devises_risque: [AUD, NZD, CAD]
  devises_refuge: [JPY, CHF, USD]
  seuil_points: 5

tracabilite:
  mode: marquer          # marquer -> affiché "non sourcée" ; rejeter -> retiré du rapport

evaluation:
  seuil_neutre_pct: 0.15 # |variation hebdo| sous ce seuil = prévision "neutre" correcte

memoire:
  # Fenêtre glissante STRICTE (en JOURS calendaires, jamais en nombre de
  # fichiers) pour tout ce qui part dans le prompt LLM : mémoire des rapports
  # précédents ET événements calendrier injectés au contexte par devise.
  # AUCUN rapport avec l'archive complète (data/rapports/, Notion), qui reste
  # 100 % conservée sans limite quel que soit ce réglage — cette fenêtre ne
  # gouverne QUE ce qui est envoyé au LLM. Avant le 2026-08-29, "nb_rapports"
  # comptait des FICHIERS (les 7 plus récents), pas des jours : avec des
  # trous dans l'historique de génération, ça pouvait injecter jusqu'à 14
  # jours de données en croyant se limiter à 7 — corrigé.
  fenetre_jours: 7

technique:
  outputsize: 230          # marge au-delà de 200 : une bougie en double retirée ne doit pas faire perdre la MM200 (incident 2026-10-10)
  rsi_periode: 14
  moyennes_mobiles: [100, 200]
  fenetre_correlation: 60
  pause_entre_appels_s: 8.5   # tier gratuit Twelve Data : 8 crédits/minute
  graphique_nb_points: 90

fred:
  series:                # nom logique -> identifiant de série FRED
    cpi_us:        CPIAUCSL
    core_pce:      PCEPILFE
    pib_us:        GDP
    nfp:           PAYEMS
    taux_fed:      DFF        # taux effectif QUOTIDIEN (FEDFUNDS = moyenne mensuelle, en retard d'un mois)
    fed_cible_basse: DFEDTARL
    fed_cible_haute: DFEDTARU
    rendement_10y: DGS10
    rendement_2y:  DGS2
    vix:           VIXCLS
    petrole_wti:   DCOILWTICO
    petrole_brent: DCOILBRENTEU
    sp500:         SP500
    bce_depot:     ECBDFR     # taux de la facilité de dépôt de la BCE (repli : API de données de la BCE)

# Taux directeurs de repli, mis à jour À LA MAIN (date obligatoire).
# L'USD est rafraîchi automatiquement via FRED (DFF, taux effectif quotidien).
# EUR : plus de saisie manuelle (lot Verrouillage) — taux de dépôt automatique (FRED ECBDFR, sinon API de la BCE),
# taux de refinancement gardé en information secondaire (registre macro, ForexFactory).
taux_directeurs:
  USD: { taux: 3.75, date: "2026-01-15" }
  GBP: { taux: 3.75, date: "2026-01-15" }
  JPY: { taux: 1.00, date: "2026-01-15" }
  CHF: { taux: 0.00, date: "2026-01-15" }
  CAD: { taux: 2.25, date: "2026-01-15" }
  AUD: { taux: 4.35, date: "2026-01-15" }
  NZD: { taux: 2.50, date: "2026-01-15" }
  CNY: { taux: 3.00, date: "2026-01-15" }   # LPR 1 an — À VÉRIFIER

# --- Scraping faible empreinte ----------------------------------------------
# Les garanties (1 requête/jour, robots.txt, 1 seul retry, blacklist 403,
# délais aléatoires, jamais de parallèle) sont codées dans core/scraping.py.
# selecteurs (optionnel) : sélecteurs CSS d'extraction des titres pour ce site ;
# à défaut, heuristique générique.
scraping:
  delai_min_s: 5
  delai_max_s: 90
  seuil_blacklist_403: 2
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  sites:
    forexfactory:    { url: "https://nfs.faireconomy.media/ff_calendar_thisweek.json", type: json, actif: true }
    tradingview:     { url: "https://www.tradingview.com/markets/currencies/cross-rates-overview-heat-map/", type: html, actif: false }
    mataf:           { url: "https://www.mataf.net/fr/forex/tools/correlation", type: html, actif: false }
    # Sources news / géopolitique / décisions économiques (état du monde) :
    financialjuice:  { url: "https://www.financialjuice.com/home", type: html, actif: false,
                       selecteurs: '[class*="headline"]' }
    finviz:          { url: "https://finviz.com/", type: html, actif: false,
                       selecteurs: "a.nn-tab-link, a.tab-link-nw" }
    financialsource: { url: "https://financialsource.co/", type: html, actif: false }

rss:
  cnbc_world:    "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100727362"
  investinglive: "https://www.forexlive.com/feed/news"   # InvestingLive (ex-ForexLive)
  # Communiqués officiels des banques centrales (lot V5) : remplacent les extractions HTML de Finviz,
  # FinancialJuice, FinancialSource et TradingView (flux vérifiés le 24/10/2026, réponse 200)
  fed_communiques: "https://www.federalreserve.gov/feeds/press_all.xml"
  bce_communiques: "https://www.ecb.europa.eu/rss/press.html"
  boe_actualites:  "https://www.bankofengland.co.uk/rss/news"
  boc_communiques: "https://www.bankofcanada.ca/content_type/press-releases/feed/"

# --- Registre des sources (lot V5, page « Santé ») ----------------------------------------------
# statut : officielle | api (API sous licence gratuite) | flux (flux public) | extraction (extraction de page)
# frequence : quotidienne (jours ouvrés) | hebdomadaire | mensuelle | trimestrielle | annuelle | collecte (date de la collecte)
# retard_jours : délai normal entre la période de la donnée et sa publication (ex. OCDE mensuel : ~45 j).
# Fraîcheur : verte jusqu'à 2 fois la normale (fréquence + retard), orange au-delà, rouge au-delà de 4 fois ou sans date.
# mesure : où lire la date de la dernière donnée (historique 5 ans, cache de collecte, registre, config).
# motifs : mots repérés dans le libellé « source » d'un chiffre du site, pour son certificat.
