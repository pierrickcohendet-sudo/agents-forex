# Mode --completer (remplissage progressif intra-journée) : ne relance jamais
# le scraping des 6 sites (cache 1 req/jour déjà garanti par core/scraping.py),
# ne retente que les devises/sections encore "analyse indisponible".
completer:
  # Dernier passage de la journée à ne pas dépasser — INFORMATIF seulement
  # (log une mention "dernier passage" au-delà), jamais un blocage : un lancement
  # manuel de test doit toujours pouvoir tourner, quelle que soit l'heure.
  heure_limite: "21:00"

chemins:
  donnees: data

# --- Matrice d'impact (refonte 8 engrenages, §8) ------------------------------
# Une case = effet de l'engrenage sur la devise, de -2 à +2, CALCULÉ en Python avec
# ces règles (modifiables ici, aucun LLM). Deux formes :
#  - par_devise : le signal a une valeur par devise ; le premier palier vérifié
#    donne les points de CETTE devise ([opérateur, seuil, points]).
#  - cas : le signal est unique ; le premier cas vérifié donne des points à
#    plusieurs devises ({si: [opérateur, seuil], effets: {DEV: points}}).
# Plusieurs règles d'un même engrenage s'additionnent, la case est bornée à ±2.
# Une devise sans règle ou un signal sans donnée vaut 0, avec la raison.
# Lecture : + = soutien pour la devise, - = pression. Jamais une recommandation.
matrice_impact:
  bilan: { soutenue: 3, pression: -3 }
  regles:
    "1":
      - signal: theme_risque
        exige_theme_fort: true          # « Signaux mixtes » : aucun effet du thème
        texte: "régime de risque du thème global"
        cas:
          - { si: ["==", "risk_off"], effets: { USD: 1, JPY: 1, CHF: 1, AUD: -1, NZD: -1, CAD: -1 } }
          - { si: ["==", "risk_on"], effets: { USD: -1, JPY: -1, CHF: -1, AUD: 1, NZD: 1, CAD: 1 } }
      - signal: theme_dollar
        exige_theme_fort: true
        texte: "direction du dollar dans le thème global"
        cas:
          - { si: ["==", "haussier"], effets: { USD: 1 } }
          - { si: ["==", "baissier"], effets: { USD: -1 } }
    "2":
      - signal: ecart_2a_us_var_4s
        par_devise: true
        unite: pb
        texte: "écart de taux 2 ans face aux États-Unis, variation sur 4 semaines"
        paliers: [[">=", 30, 2], [">=", 15, 1], ["<=", -30, -2], ["<=", -15, -1]]
      - signal: us2a_var_4s
        unite: pb
        texte: "rendement 2 ans US, variation sur 4 semaines"
        cas:
          - { si: [">=", 30], effets: { USD: 2 } }
          - { si: [">=", 15], effets: { USD: 1 } }
          - { si: ["<=", -30], effets: { USD: -2 } }
          - { si: ["<=", -15], effets: { USD: -1 } }
    "3":
      - signal: surprise_30j
        par_devise: true
        unite: écarts
        texte: "indice de surprise macro 30 jours"
        paliers: [[">=", 1.0, 2], [">=", 0.5, 1], ["<=", -1.0, -2], ["<=", -0.5, -1]]
    "4":
      - signal: prime_terme_var_4s
        unite: pb
        texte: "prime de terme 10 ans US, variation sur 4 semaines (prime de risque budgétaire)"
        cas:
          - { si: [">=", 20], effets: { USD: -1 } }
      - signal: btp_bund_var_3m
        unite: pb
        texte: "écart Italie − Allemagne 10 ans, variation sur 3 mois"
        cas:
          - { si: [">=", 25], effets: { EUR: -1 } }
          - { si: ["<=", -25], effets: { EUR: 1 } }
    "5":
      - signal: vix
        unite: pts
        texte: "niveau du VIX"
        cas:
          - { si: [">=", 30], effets: { USD: 1, JPY: 2, CHF: 2, AUD: -2, NZD: -2, CAD: -1 } }
          - { si: [">=", 25], effets: { USD: 1, JPY: 1, CHF: 1, AUD: -1, NZD: -1, CAD: -1 } }
          - { si: ["<=", 14], effets: { JPY: -1, CHF: -1, AUD: 1, NZD: 1 } }
      - signal: sp500_var_4s
        unite: "%"
        texte: "S&P 500, variation sur 4 semaines"
        cas:
          - { si: [">=", 4], effets: { AUD: 1, NZD: 1 } }
          - { si: ["<=", -4], effets: { AUD: -1, NZD: -1, JPY: 1 } }
    "6":
      - signal: titres_refuge
        unite: titres
        texte: "titres du jour au canal « refuge (conflits) »"
        cas:
          - { si: [">=", 3], effets: { USD: 1, JPY: 1, CHF: 1 } }
      - signal: titres_energie
        unite: titres
        texte: "titres du jour au canal « énergie »"
        cas:
          - { si: [">=", 3], effets: { CAD: 1, JPY: -1, EUR: -1 } }
    "7":
      - signal: ecart_mm200
        par_devise: true
        unite: "%"
        texte: "écart du cours à sa moyenne mobile 200 jours (tendance)"
        paliers: [[">=", 2, 1], ["<=", -2, -1]]
      - signal: cot_percentile_52s
        par_devise: true
        unite: percentile
        texte: "positionnement spéculatif COT, lecture contrarienne (extrêmes)"
        paliers: [[">=", 90, -1], ["<=", 10, 1]]
    "8":
      - signal: brent_var_4s
        unite: "%"
        texte: "Brent, variation sur 4 semaines"
        cas:
          - { si: [">=", 10], effets: { CAD: 1, JPY: -1, EUR: -1 } }
          - { si: ["<=", -10], effets: { CAD: -1, JPY: 1 } }
      - signal: stocks_ecart_pct
        unite: "%"
        texte: "stocks de brut US contre la moyenne 5 ans de la même semaine"
        cas:
          - { si: ["<=", -5], effets: { CAD: 1 } }
          - { si: [">=", 5], effets: { CAD: -1 } }

  # Couverture par devise (lot V5) : engrenages 4, 5, 6 et 8. Effet = signe de simulateur.lecture_classique
  # × sens du franchissement, appliqué à une devise SEULEMENT si le signe mesuré sur 5 ans le confirme pour ce
  # sens (sensibilité de même signe, médiane à 1 mois conforme, borne basse de Wilson à 90 % > 50 % ; données
  # docs/data/impact.json, comme le tableau des conséquences). Déclenchement : seuil fixe OU percentile sur 5 ans
  # de la même mesure (85e en haut, 15e en bas). Une devise déjà couverte par une règle ci-dessus sur le même
  # indicateur n'est jamais comptée deux fois. Série heurtée : neutralisée (visible). Calcul : core/couverture.py.
  couverture:
    percentiles: [15, 85]
    fenetre_jours: 28            # « variation » = sur 4 semaines
    regles:
      "4":
        - indicateur: us10a      # clé de simulateur.lecture_classique et de impact.json
          serie: USD_10a         # série canonique de l'historique 5 ans
          mesure: variation
          unite: pb
          seuils: { haut: 25, bas: -25 }
          texte: "10 ans US, variation sur 4 semaines"
          pedagogie: "Des taux longs américains qui montent rendent les placements en dollars plus rémunérateurs : les capitaux affluent vers le dollar, au détriment des autres devises. Une forte hausse peut aussi traduire une prime de risque budgétaire (engrenage 4)."
      "5":
        - indicateur: vix
          serie: vix
          mesure: niveau
          unite: pts
          seuils: { haut: 25, bas: 14 }
          texte: "niveau du VIX"
          pedagogie: "Le VIX mesure la peur sur les actions américaines. Quand il monte, les investisseurs vendent les devises « risquées » (AUD, NZD, CAD) et achètent les refuges (USD, JPY, CHF) ; quand il est très bas, c'est l'inverse."
        - indicateur: sp500
          serie: sp500
          mesure: variation
          unite: "%"
          seuils: { haut: 4, bas: -4 }
          texte: "S&P 500, variation sur 4 semaines"
          pedagogie: "Des actions en forte hausse signalent l'appétit pour le risque : les devises cycliques en profitent, les refuges reculent. Une baisse marquée produit l'effet inverse."
        - indicateur: dollar_large
          serie: dollar_large
          mesure: variation
          unite: "%"
          seuils: { haut: 2, bas: -2 }
          texte: "indice dollar large (Fed), variation sur 4 semaines"
          pedagogie: "L'indice dollar large de la Fed résume la force du dollar face à ses partenaires commerciaux : quand il monte, presque toutes les autres devises baissent face au dollar."
      "6":
        - indicateur: or
          serie: indice_or
          mesure: variation
          unite: "%"
          seuils: { haut: 5, bas: -5 }
          texte: "indice or (proxy), variation sur 4 semaines"
          pedagogie: "L'or est le refuge des périodes de tension géopolitique : une forte hausse accompagne souvent un dollar plus faible et un franc suisse plus fort (lecture à confirmer sur 5 ans)."
      "8":
        - indicateur: brent
          serie: brent
          mesure: variation
          unite: "%"
          seuils: { haut: 10, bas: -10 }
          texte: "Brent, variation sur 4 semaines"
          pedagogie: "Un pétrole plus cher soutient les devises des pays exportateurs (CAD) et pèse sur celles des importateurs (JPY, EUR), via la balance commerciale."

# --- Simulateur d'impact : lecture classique (refonte §12) ---------------------
# Sens attendu « dans les manuels » pour une HAUSSE de l'indicateur (une baisse inverse
# le signe) : +1 la devise s'apprécie, -1 elle se déprécie ; devise absente = pas de
# lecture classique. Python compare le signe de la médiane mesurée à cette lecture :
# le mécanisme pédagogique n'est affiché que si les deux concordent.
simulateur:
  lecture_classique:
    us2a:         { USD: 1, EUR: -1, GBP: -1, JPY: -1, CHF: -1, CAD: -1, AUD: -1, NZD: -1, CNY: -1 }
    us10a:        { USD: 1, EUR: -1, GBP: -1, JPY: -1, CHF: -1, CAD: -1, AUD: -1, NZD: -1, CNY: -1 }
    oblig_us:     { USD: -1, EUR: 1, GBP: 1, JPY: 1, CHF: 1, CAD: 1, AUD: 1, NZD: 1, CNY: 1 }
    fed:          { USD: 1, EUR: -1, GBP: -1, JPY: -1, CHF: -1, CAD: -1, AUD: -1, NZD: -1, CNY: -1 }
    pib_us:       { USD: 1, EUR: -1, GBP: -1, JPY: -1, CHF: -1 }
    cpi_core_us:  { USD: 1, EUR: -1, GBP: -1, JPY: -1, CHF: -1, AUD: -1, NZD: -1 }
    cpi_us:       { USD: 1, EUR: -1, JPY: -1 }
    vix:          { USD: 1, EUR: -1, GBP: -1, JPY: 1, CHF: 1, CAD: -1, AUD: -1, NZD: -1 }
    dollar_large: { USD: 1, EUR: -1, GBP: -1, JPY: -1, CHF: -1, CAD: -1, AUD: -1, NZD: -1, CNY: -1 }
    brent:        { CAD: 1, JPY: -1, EUR: -1 }
    or:           { USD: -1, CHF: 1, AUD: 1 }
    sp500:        { USD: -1, JPY: -1, CHF: -1, GBP: 1, CAD: 1, AUD: 1, NZD: 1 }
