# ============================================================
# Configuration centrale du pipeline FX.
# Tout ce qui évolue (devise, source, indicateur, pondération,
# modèle LLM) se règle ICI, jamais dans le code.
# ============================================================

llm:
  fournisseur: gemini            # principal ; "gemini" et "groq" implémentés — nouveau fournisseur = 1 classe dans core/llm.py
  # Nom FIXE (2026-10-09) : l'alias « gemini-flash-latest » pointe vers un modèle saturé
  # (503 « high demand » presque tous les jours) et au quota gratuit de 20 requêtes/JOUR
  # (429 « PerDay »). gemini-3.5-flash répond (test réel, prompt ~17 000 tokens en 3 s).
  modele: gemini-3.5-flash
  temperature: 0.2

  # CHAÎNE DE MODÈLES (2026-10-09) : liste ORDONNÉE ; l'appel va au premier modèle disponible.
  # Quota gratuit Gemini : 20 requêtes/jour/modèle (429 « PerDay » constaté). Compteur d'appels par
  # modèle et par jour dans `fichier_quota` (versionné avec data/cache : partagé entre les runs
  # GitHub Actions, remis à zéro au changement de jour UTC ; un 429 « PerDay » marque aussi le
  # modèle épuisé jusqu'à l'heure de reprise donnée par l'API). Un modèle au plafond (ou au
  # disjoncteur ouvert) est SAUTÉ sans attente ; le plafond n'est jamais dépassé. Si tous sont
  # épuisés : sections « indisponible : quota atteint », retentées par --completer après la
  # remise à zéro. `quota_jour` = plafond LOCAL (prudent pour Flash-Lite : limite réelle non lue).
  # Si `modeles` est présent, il remplace `modele` + `secours` ci-dessous.
  modeles:
    - { modele: gemini-3.5-flash,      quota_jour: 20 }
    - { modele: gemini-3.8-flash,      quota_jour: 20 }
    - { modele: gemini-3.5-flash-lite, quota_jour: 20 }
  fichier_quota: data/cache/quota_llm.json

  # Disjoncteur : après N échecs consécutifs du modèle principal pendant un run (ou dès
  # un quota journalier épuisé), il est ignoré pour le reste du run et les appels vont
  # directement au secours. Au run suivant, le principal est retenté. État dans
  # rapport.meta.disjoncteur.
  disjoncteur:
    actif: true
    seuil_echecs_consecutifs: 3
  max_tentatives_json: 2         # tentatives de parsing JSON par appel LLM
  pause_entre_appels_s: 7        # tier gratuit Gemini : espace TOUS les appels (9 devises + synthèses)
  backoff_429_s: 30              # attente réelle avant nouvel essai après un 429 (Retry-After respecté si plus long)

  # Pause entre deux devises analysées (en plus de pause_entre_appels_s) :
  # évite la rafale de 9 gros prompts consécutifs au run du matin. N'attend
  # jamais pour une devise déjà réussie réutilisée par --completer.
  pause_entre_devises_s: 20

  # Fournisseur de SECOURS (2026-10-02) : MÊME clé GEMINI_API_KEY, modèle
  # Flash-Lite (nom vérifié via l'API ListModels avec notre clé, appel réel
  # réussi avec un prompt de ~36 000 tokens > nos ~22 000 ; contexte 1 M
  # tokens). Sollicité UNIQUEMENT si le modèle principal échoue sur cet appel
  # précis (après son propre retry 429/503). Limites gratuites appliquées par
  # PROJET et par modèle : le secours a donc son propre quota.
  secours:
    actif: true
    fournisseur: gemini
    modele: gemini-3.5-flash-lite   # alternative stable : gemini-3.1-flash-lite
    temperature: 0.2
    pause_entre_appels_s: 7
    backoff_429_s: 30

  # Ancienne config du secours Groq, DÉSACTIVÉE (tier gratuit 8 000 TPM
  # structurellement trop petit pour nos prompts). Le code FournisseurGroq reste
  # dans core/llm.py ; pour le réactiver, recopier ce bloc sous `secours:`.
  # # Fournisseur de SECOURS : câblé, testé, DÉSACTIVÉ PAR DÉFAUT (2026-08-24).
  # # Verdict après mesure réelle : le prompt par devise (mémoire 7j + news +
  # # catalogue de sources) fait 70-90K car. (~17,5-22,5K tokens) et celui de
  # # l'agent critique 88K+ car. — même avec la réduction générique ci-dessous
  # # (_reduire_message dans core/llm.py), redescendre sous les 8 000 TPM
  # # gratuits de Groq exige de tronquer si fort (mémoire à 1 jour, catalogue à
  # # 1-2 sources) que le résultat n'a plus la richesse d'une analyse tracée.
  # # Le tier gratuit Groq n'est structurellement PAS dimensionné pour les
  # # appels lourds de ce pipeline. Gemini seul (avec sa dégradation propre —
  # # retries, --completer, statuts "analyse indisponible"/"non_evalue" jamais
  # # menteurs) reste le filet de sécurité recommandé. Repasser actif: true
  # # pour réessayer (tier payant Groq, usage ponctuel, ou si le volume de
  # # contexte envoyé baisse structurellement) — GROQ_API_KEY requise dans .env.
  # secours:
  #   actif: false
  #   fournisseur: groq
  #   # llama-3.3-70b-versatile a été RETIRÉ des modèles Groq actifs (constaté
  #   # le 2026-08-23) -> openai/gpt-oss-20b : même limite gratuite (8 000 TPM),
  #   # plus rapide, JSON mode confirmé compatible (doc officielle Groq).
  #   # Vérifier sur console.groq.com/docs/models si ce nom change à son tour.
  #   modele: openai/gpt-oss-20b
  #   temperature: 0.2
  #   # Tier gratuit Groq confirmé (console.groq.com/docs/rate-limits, vérifié
  #   # le 2026-08-23) : 8 000 TPM en fenêtre GLISSANTE, pas juste "par appel" —
  #   # deux appels rapprochés se cumulent dans la même fenêtre. 40 s laisse la
  #   # fenêtre se vider entre deux appels plutôt que les 3 s d'origine.
  #   pause_entre_appels_s: 40
  #   backoff_429_s: 30
  #   # Budgets en TOKENS (l'unité réellement limitée par Groq — plus de
  #   # mélange caractères/tokens dans les logs). systeme+message réduits
  #   # visent ~5 000 tokens à eux deux, sous les 8 000 TPM réels, en laissant
  #   # de la marge pour la réponse ET le cumul de la fenêtre glissante.
  #   budget_tokens_systeme: 2000     # connaissances/ réduit à ~8 000 car.
  #   budget_tokens_message: 3000     # contexte par devise réduit à ~12 000 car.
  #   budget_tokens_total_max: 5500   # garde-fou : refus AVANT envoi si encore dépassé après réduction
  #   # Ordre de priorité si budget_tokens_systeme oblige à omettre des
  #   # fichiers connaissances/ : les plus directement utiles au score d'abord,
  #   # les plus accessoires (exemples illustratifs, définitions) sacrifiés en premier.
  #   connaissances_prioritaires:
  #     - banques_centrales.md
  #     - indicateurs_fondamentaux.md
  #     - indicateurs_techniques.md
  #     - cas_particuliers.md
  #     - exemples_annotes.md
  #     - glossaire.md

# --- Tableau macro (base Notion + dashboard web) ------------------------------
# Indicateurs en lignes, devises en colonnes, 3 types de valeur (Actuel /
# Précédent / Prévision). Données : page « mois » de ForexFactory (seule source
# gratuite avec les valeurs « réel » — les exports officiels JSON/XML/CSV/ICS
# n'en ont pas, vérifié le 2026-10-06), registre permanent data/registre_macro.json.
tableau_macro:
  actif: true
  # ID de la base Notion « Tableau macro » (créée sous la même page parente que
  # « Rapports FX » ; laisser vide : retrouvée par titre ou créée, puis écrite ici).
  database_id: "1c44fc8adda24c2c811e04b638107bfc"
  # Ancienne base (structure Type x 9 colonnes devises), archivée le 2026-10-08 : conservée, plus alimentée.
  ancienne_database_id: "663661d2dd3d42fb808b397caa79ea87"
  ordre_devises: [USD, EUR, GBP, JPY, CHF, CAD, AUD, NZD, CNY]
  forexfactory:
    url: "https://www.forexfactory.com/calendar?month=this"
    url_mois: "https://www.forexfactory.com/calendar?month={mois}"
    # Plafond TOTAL de requêtes sur la page « mois » par jour (UTC), tous motifs
    # confondus (créneaux, mois suivants, mises à jour ciblées). Les 2 premiers
    # créneaux = matin + soir ; le reste sert aux mois suivants et aux ciblées.
    plafond_requetes_par_jour: 6
    # Créneaux de collecte (UTC) : un créneau est « dû » dès que l'heure est
    # passée et qu'aucune requête n'a eu lieu depuis. Les passages horaires
    # --completer déclenchent donc la collecte de 19:15 même si le cron glisse.
    creneaux_utc: ["05:15", "19:15"]
    # Au PREMIER créneau du jour : si des cases n'ont pas de date de prochaine
    # publication, on lit le mois suivant, puis (si encore des trous, ex. PIB
    # trimestriel) le mois d'après — jamais plus, jamais sans besoin.
    mois_suivants_si_necessaire: ["next", "plus2"]
    # Mises à jour CIBLÉES : une publication d'impact fort/moyen dont l'heure est
    # passée depuis au moins `delai_apres_publication_min` minutes et dont le
    # « réel » manque encore déclenche une requête (max `tentatives_ciblees_max`
    # par publication, dans la limite du plafond ci-dessus).
    delai_apres_publication_min: 15
    tentatives_ciblees_max: 2
    impacts_cibles: ["high", "medium"]
  # sens : normal = au-dessus du consensus est « bon » (vert sur le web) ;
  # inverse = chômage (au-dessus = mauvais, rouge). Les symboles ▲▼= restent littéraux.
  indicateurs:
    taux_directeur:      { libelle: "Taux directeur",         unite: "%", sens: normal, bornes: [-1, 25], periodicite_jours: 60, echelle_surprise: 0.25, poids_surprise: 3 }
    cpi:                 { libelle: "CPI annuel",             unite: "%", sens: normal, bornes: [-5, 30], periodicite_jours: 31, tolerance: 0.2, echelle_surprise: 0.1, poids_surprise: 3 }
    cpi_core:            { libelle: "CPI core annuel",        unite: "%", sens: normal, bornes: [-5, 30], periodicite_jours: 31, tolerance: 0.2, echelle_surprise: 0.1, poids_surprise: 2 }
    pib:                 { libelle: "PIB trimestriel",        unite: "%", sens: normal, bornes: [-25, 30], periodicite_jours: 92, tolerance: 0.3, echelle_surprise: 0.3, poids_surprise: 2 }
    pmi_manufacturier:   { libelle: "PMI manufacturier",      unite: "",  sens: normal, bornes: [20, 80], periodicite_jours: 31, echelle_surprise: 1.0, poids_surprise: 1.5 }
    pmi_services:        { libelle: "PMI services",           unite: "",  sens: normal, bornes: [20, 80], periodicite_jours: 31, echelle_surprise: 1.0, poids_surprise: 1.5 }
    chomage:             { libelle: "Taux de chômage",        unite: "%", sens: inverse, bornes: [0, 40], periodicite_jours: 31, tolerance: 0.2, echelle_surprise: 0.1, poids_surprise: 2 }
    emploi:              { libelle: "Variation de l'emploi",  unite: "",  sens: normal, bornes: [-5000000, 5000000], periodicite_jours: 31, tolerance_absolue: 15000, echelle_surprise: 0.1, echelle_surprise_absolue: 60000, poids_surprise: 3 }
    ventes_detail:       { libelle: "Ventes au détail",       unite: "%", sens: normal, bornes: [-30, 30], periodicite_jours: 31, tolerance: 0.2, echelle_surprise: 0.3, poids_surprise: 1.5 }
    balance_commerciale: { libelle: "Balance commerciale",    unite: "",  sens: normal, bornes: [-50000000000000, 50000000000000], periodicite_jours: 31, tolerance_absolue: 1500000000, echelle_surprise: 0.3, echelle_surprise_absolue: 3000000000, poids_surprise: 1 }
    # Données de MARCHÉ (pas de consensus : Prévision = « — (donnée de marché) ») ; voir taux_obligataires.
    rendement_2a:        { libelle: "Rendement 2 ans",      unite: "%", sens: normal, marche: true, bornes: [-2, 25] }
    rendement_10a:       { libelle: "Rendement 10 ans",     unite: "%", sens: normal, marche: true, bornes: [-2, 25] }
    spread_2a_usd:       { libelle: "Spread 2 ans vs USD",  unite: "",  sens: normal, marche: true, bornes: [-2000, 2000] }
  # Marge (jours) ajoutée à periodicite_jours avant de déclarer une publication manquée.
  marge_peremption_jours: 20
  # Écart FF/FRED au-delà de `tolerance` (points) ou `tolerance_absolue` => « divergence de sources ».
  # Fenêtre de l'indice de surprise (jours) ; |surprise normalisée| plafonnée à `plafond_surprise`.
  indice_surprise: { fenetre_jours: 30, plafond_surprise: 3, seuil_tendance: 0.15 }
  # Rendements souverains : sources gratuites VÉRIFIÉES sur les vraies données le 2026-10-08 (une
  # requête par source et par jour). `absent` = pas de source gratuite exploitable (texte affiché).
  taux_obligataires:
    jours_variation: 7        # « semaine précédente » = dernière observation d'il y a >= 7 jours
    sources:
      USD:
        2a:  { type: fred, serie: DGS2, source: "FRED (DGS2)" }
        10a: { type: fred, serie: DGS10, source: "FRED (DGS10)" }
      EUR:   # Allemagne (benchmark de la zone euro) ; l'API de la BCE renvoyait des erreurs 500 le jour du test
        2a:  { type: bundesbank, code: "BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.R02XX.R.A.A._Z._Z.A", source: "Bundesbank (Allemagne 2 ans)" }
        10a: { type: bundesbank, code: "BBSIS/D.I.ZST.ZI.EUR.S1311.B.A604.R10XX.R.A.A._Z._Z.A", source: "Bundesbank (Allemagne 10 ans)" }
      GBP:
        2a:  { absent: "2 ans non publié en accès libre (BoE : 5/10/20 ans)" }
        10a: { type: boe, code: IUDMNPY, source: "Banque d'Angleterre (par yield 10 ans, IUDMNPY)" }
      JPY:
        2a:  { type: mof, colonne: "2Y", source: "Ministère des Finances du Japon (JGB 2 ans)" }
        10a: { type: mof, colonne: "10Y", source: "Ministère des Finances du Japon (JGB 10 ans)" }
      CHF:
        2a:  { absent: "SNB : série arrêtée (dernière donnée 07/2025)" }
        10a: { type: fred_mensuel, serie: IRLTLT01CHM156N, source: "OCDE via FRED (IRLTLT01CHM156N)" }
      CAD:
        2a:  { type: boc, serie: BD.CDN.2YR.DQ.YLD, source: "Banque du Canada (Valet, 2 ans)" }
        10a: { type: boc, serie: BD.CDN.10YR.DQ.YLD, source: "Banque du Canada (Valet, 10 ans)" }
      AUD:
        2a:  { absent: "RBA : accès automatisé refusé (403)" }
        10a: { type: fred_mensuel, serie: IRLTLT01AUM156N, source: "OCDE via FRED (IRLTLT01AUM156N)" }
      NZD:
        2a:  { absent: "RBNZ : accès automatisé refusé (403)" }
        10a: { type: fred_mensuel, serie: IRLTLT01NZM156N, source: "OCDE via FRED (IRLTLT01NZM156N)" }
      CNY:
        2a:  { absent: "aucune source gratuite exploitable" }
        10a: { absent: "aucune source gratuite exploitable" }
  # Trois graphiques du dashboard web (FRED, quotidien, 1 an d'historique ; période 1M / 3M / 1A
  # réglable côté navigateur) et leurs miniatures Notion (section macro globale du rapport).
  graphiques_marche:
    vix:
      titre: "VIX — volatilité implicite du S&P 500"
      unite: "pts"
      source: "FRED (VIXCLS)"
      series:
        vix: { serie: VIXCLS, libelle: "VIX", couleur: "#f59e0b" }
    petrole:
      titre: "Pétrole — WTI et Brent"
      unite: "$/baril"
      source: "FRED (DCOILWTICO, DCOILBRENTEU)"
      series:
        wti:   { serie: DCOILWTICO, libelle: "WTI", couleur: "#eab308" }
        brent: { serie: DCOILBRENTEU, libelle: "Brent", couleur: "#38bdf8" }
    dollar:
      titre: "Indice dollar large (Fed) — pas le DXY"
      unite: "indice"
      source: "FRED (DTWEXBGS) · Fed, ~4 jours de retard"
      note: "Le DXY (ICE) n'est pas gratuit : indice dollar large de la Fed, pondéré par les échanges commerciaux."
      series:
        dollar: { serie: DTWEXBGS, libelle: "Indice dollar large (Fed)", couleur: "#22c55e" }
  # Séries FRED : repli (case sans valeur ForexFactory) et/ou contrôle croisé.
  # FRED donne la PÉRIODE observée, pas la date de publication (affichée « pér. MM/AA »).
  # Vérifiées le 2026-10-06 : valeurs US identiques à ForexFactory (UNRATE 4,2 ; PAYEMS +29K ;
  # PIB 2,2 ; balance -105,6 Md). Séries internationales OCDE : contrôle seulement (retard).
  fred:
    series:
      cpi:      { USD: { serie: CPIAUCSL, calcul: yoy, unite: "%", usage: repli_et_controle } }
      cpi_core: { USD: { serie: CPILFESL, calcul: yoy, unite: "%", usage: repli_et_controle } }
      chomage:
        USD: { serie: UNRATE, calcul: niveau, unite: "%", usage: repli_et_controle }
        JPY: { serie: LRHUTTTTJPM156S, calcul: niveau, unite: "%", usage: controle }
        CAD: { serie: LRHUTTTTCAM156S, calcul: niveau, unite: "%", usage: controle }
        NZD: { serie: LRUNTTTTNZQ156S, calcul: niveau, unite: "%", usage: controle }
      emploi:   { USD: { serie: PAYEMS, calcul: diff, unite: K, usage: repli_et_controle } }
      pib:      { USD: { serie: A191RL1Q225SBEA, calcul: niveau, unite: "%", usage: repli_et_controle } }
      ventes_detail: { USD: { serie: RSAFS, calcul: pct_m, unite: "%", usage: repli_et_controle } }
      balance_commerciale:
        USD: { serie: BOPGSTB, calcul: milliards, unite: B, usage: repli_et_controle }
        CHF: { serie: XTEXVA01CHM667S, serie_moins: XTIMVA01CHM667S, calcul: unites_milliards, unite: B, usage: repli, etiquette: "équiv. OCDE, USD" }
    # Projections OFFICIELLES de banque centrale, affichées « proj. BC » dans la ligne Prévision
    # quand le consensus n'existe pas encore. Fed : SEP (médiane), publié sur FRED.
    # La Fed ne projette pas le CPI (elle projette le PCE) : pas de projection affichée pour le CPI.
    projections:
      USD:
        taux_directeur: { serie: FEDTARMD, unite: "%", horizon: "fin {annee}", source: "Fed SEP, médiane" }
        chomage:        { serie: UNRATEMD, unite: "%", horizon: "T4 {annee}", source: "Fed SEP, médiane" }
        pib:            { serie: GDPC1MD,  unite: "%", horizon: "croiss. T4/T4 {annee}", source: "Fed SEP, médiane" }
  # Correspondance (indicateur, devise) -> événement(s) ForexFactory, vérifiée sur
  # les pages « mois » de 2026-09 et 2026-10 (identifiants `ebaseId` stables).
  # - ff: liste d'événements ; une publication préliminaire puis finale du même
  #   indicateur (flash/final, advance/final) = plusieurs entrées, la plus
  #   récente publiée l'emporte. `id` = ebaseId ; `nom` seul = identification par
  #   titre exact (id pas encore observé : à confirmer au remplissage initial).
  # - etiquette: ajoutée à la valeur quand la définition diffère de la référence
  #   (ex. « m/m » là où l'indicateur de référence est annuel) — jamais de valeur
  #   présentée sous un faux nom.
  # - absent: texte affiché dans les 3 lignes quand ForexFactory ne publie pas
  #   d'équivalent (pas de cellule vide silencieuse).
  correspondances:
    taux_directeur:
      USD: { ff: [{ id: 1,   nom: "Federal Funds Rate" }] }
      EUR: { ff: [{ id: 12,  nom: "Main Refinancing Rate" }] }
      GBP: { ff: [{ id: 15,  nom: "Official Bank Rate" }] }
      JPY: { ff: [{ id: 641, nom: "BOJ Policy Rate" }] }
      CHF: { ff: [{ id: 834, nom: "SNB Policy Rate" }] }
      CAD: { ff: [{ id: 13,  nom: "Overnight Rate" }] }
      AUD: { ff: [{ id: 21,  nom: "Cash Rate" }] }
      NZD: { ff: [{ id: 23,  nom: "Official Cash Rate" }] }
      CNY: { ff: [{ id: 777, nom: "1-y Loan Prime Rate" }], etiquette: "LPR 1 an" }
    cpi:
      USD: { ff: [{ id: 884, nom: "CPI y/y" }] }
      EUR: { ff: [{ id: 168, nom: "CPI Flash Estimate y/y" }, { id: 166, nom: "Final CPI y/y" }] }
      GBP: { ff: [{ id: 82,  nom: "CPI y/y" }] }
      JPY: { ff: [{ id: 174, nom: "National Core CPI y/y" }], etiquette: "équiv. core national" }   # CPI national hors alimentation fraîche (core japonais)
      CHF: { ff: [{ id: 100, nom: "CPI m/m" }], etiquette: "m/m" }
      CAD: { ff: [{ id: 80,  nom: "CPI m/m" }], etiquette: "m/m" }
      AUD: { ff: [{ id: 888, nom: "CPI y/y" }] }
      NZD: { ff: [{ id: 173, nom: "CPI q/q" }], etiquette: "t/t", periodicite_jours: 92 }
      CNY: { ff: [{ id: 454, nom: "CPI y/y" }] }
    cpi_core:
      USD: { ff: [{ id: 933, nom: "Core CPI y/y" }] }
      EUR: { ff: [{ id: 593, nom: "Core CPI Flash Estimate y/y" }, { id: 167, nom: "Final Core CPI y/y" }] }
      GBP: { ff: [{ id: 83,  nom: "Core CPI y/y" }] }
      JPY: { ff: [{ id: 631, nom: "BOJ Core CPI y/y" }], etiquette: "BoJ hors alim./énergie" }   # spec ForexFactory : hors alimentation, énergie et facteurs institutionnels (mesure sous-jacente de la BoJ), publiée ~dernier vendredi du mois ; distincte du « National Core » (hors alimentation fraîche) affiché dans la ligne CPI
      CHF: { absent: "non couvert par ForexFactory" }
      CAD: { ff: [{ id: 659, nom: "Median CPI y/y" }], etiquette: "médian" }
      AUD: { ff: [{ id: 99,  nom: "Trimmed Mean CPI m/m" }], etiquette: "moy. tronquée m/m" }
      NZD: { absent: "non couvert par ForexFactory" }
      CNY: { absent: "non couvert par ForexFactory" }
    pib:
      USD: { ff: [{ id: 2,   nom: "Advance GDP q/q" }, { id: 27, nom: "Prelim GDP q/q" }, { id: 28, nom: "Final GDP q/q" }] }
      EUR: { ff: [{ id: 638, nom: "Prelim Flash GDP q/q" }, { id: 42, nom: "Revised GDP q/q" }] }
      GBP: { ff: [{ id: 33, nom: "Prelim GDP q/q" }, { id: 35, nom: "Final GDP q/q" }] }
      JPY: { ff: [{ id: 36, nom: "Prelim GDP q/q" }, { id: 37, nom: "Final GDP q/q" }] }
      CHF: { ff: [{ id: 32,  nom: "GDP q/q" }] }
