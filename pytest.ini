[pytest]
# Suite de tests : `python -m pytest` (réseau bloqué, 60 s maximum par test ; voir tests/conftest.py).
testpaths = tests
python_files = test_*.py
timeout = 60
timeout_method = thread
# blocage hors test (collecte, fin de session) : pile de tous les fils écrite après 120 s pour le diagnostic
faulthandler_timeout = 120
markers =
    reseau: test qui a vraiment besoin du réseau ; exclu par défaut, lancé à part avec `pytest -m reseau`
addopts = -m "not reseau" -q -p no:cacheprovider
