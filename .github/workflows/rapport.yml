# Rapport FX quotidien : exécute le pipeline puis committe les données
# (docs/data pour GitHub Pages, data/rapports + data/cache + data/hebdo comme
# mémoire entre exécutions — GitHub Actions est sans état).
#
# Déclenchements par jour ouvré :
# - 08:15 UTC : run COMPLET (après la remise à zéro des quotas Gemini) (collecte + analyse des 9 devises). --type reste
#   "auto" (défaut de orchestrateur.py) pour laisser l'auto-détection hebdo
#   (lundi) / mensuel (le 1er) fonctionner normalement.
# - 09:15 -> 21:15 UTC, TOUTES LES HEURES (13 passages) : COMPLÉMENT
#   (--completer). Les 503 Gemini étant transitoires, multiplier les essais
#   étalés dans la journée est la parade gratuite. Chaque passage ne retente
#   que ce qui est encore indisponible (devises "analyse indisponible", état du
#   monde, collectes API restées en erreur) et s'arrête immédiatement s'il n'y
#   a rien à faire (aucune publication inutile). Il ne relance jamais le
#   scraping des 6 sites (cache du jour, core/scraping.py) ni une collecte API
#   déjà complète (core/collecte_cache.py). --type reste "auto" : un lundi ou le
#   1er du mois, forcer "quotidien" écraserait meta.type_rapport.
# - 08:45 UTC : SECOURS — run complet seulement si le rapport du jour n'existe pas
#   (le run de 08:15 n'a pas eu lieu) ; sinon le job s'arrête aussitôt.
# - RATTRAPAGE : tout passage planifié de semaine fait un run complet s'il n'existe
#   pas encore de rapport pour la date du jour (étape « Décider du mode »).
# Heure de déclenchement des cron GitHub Actions : peut glisser de plusieurs heures,
# voire ne jamais se produire aux heures de forte charge (15/10/2026 : aucun passage
# planifié créé entre 22:16 la veille et 12:36 UTC). D'où le secours et le rattrapage.
name: rapport-fx

on:
  schedule:
    - cron: "15 8 * * 1-5"    # run complet (matin) : APRÈS la remise à zéro des quotas Gemini
                              # (minuit heure du Pacifique = 07:00 UTC l'été, 08:00 UTC l'hiver)
    - cron: "45 8 * * 1-5"    # SECOURS : ne fait quelque chose que si le run de 08:15 n'a pas eu lieu
                              # (pas de rapport du jour) ; sinon le job s'arrête aussitôt
    - cron: "15 9-21 * * 1-5" # compléments horaires 09:15 -> 21:15 UTC (après le run complet) ;
                              # RATTRAPAGE : sans rapport du jour, le passage fait un run complet
    - cron: "15 7 * * 0"      # dimanche : dossier hebdomadaire des 8 engrenages (--hebdo)
  workflow_dispatch:
    inputs:
      completer:
        description: "Passage de complément (--completer) plutôt qu'un run complet"
        type: boolean
        default: false
      hebdo:
        description: "Dossier hebdomadaire des 8 engrenages (--hebdo) : un appel LLM par engrenage + synthèse"
        type: boolean
        default: false
      # Déclencheur externe (cron-job.org, docs/GUIDE_DECLENCHEUR.md) : declencheur=externe, creneau=matin|heure|dimanche.
      # Laisser vide pour un lancement manuel.
      declencheur:
        description: "Réservé au déclencheur externe (laisser vide)"
        type: string
        default: ""
      creneau:
        description: "Réservé au déclencheur externe : matin, heure ou dimanche (laisser vide)"
        type: string
        default: ""

permissions:
  contents: write             # nécessaire pour pousser docs/data et data/rapports
  actions: read               # garde-fou anti-doublon : liste des runs récents (lecture seule)
  issues: write               # alerte de fin de run (issue GitHub automatique, core/notifications.py)

concurrency:
  group: rapport-fx
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # collecte lente par construction (délais aléatoires 5-90 s)
    steps:
      - uses: actions/checkout@v4

      # Décision AVANT toute installation : hebdo, complet, complément ou rien (outils/decider_mode.py, testé).
      # Rattrapage : sans rapport du jour, tout passage automatique fait un run complet (crons GitHub parfois
      # retardés de plusieurs heures). Garde-fou : un passage automatique (cron GitHub ou cron-job.org) arrivé
      # moins de 20 min après un autre run réussi ou en cours ne fait rien. Un lancement manuel n'est jamais bloqué.
      - name: Décider du mode
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          IN_COMPLETER: ${{ github.event.inputs.completer }}
          IN_HEBDO: ${{ github.event.inputs.hebdo }}
          IN_DECLENCHEUR: ${{ github.event.inputs.declencheur }}
          IN_CRENEAU: ${{ github.event.inputs.creneau }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUNS_JSON=$(gh run list --repo "${{ github.repository }}" --workflow rapport.yml --limit 20 --json databaseId,createdAt,status,conclusion,event 2>/dev/null || echo "[]")
          export RUNS_JSON
          python3 outils/decider_mode.py

      - uses: actions/setup-python@v5
        if: steps.decision.outputs.mode != 'rien'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        if: steps.decision.outputs.mode != 'rien'
        run: pip install -r requirements.txt

      - name: Générer le rapport
        if: steps.decision.outputs.mode != 'rien'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          case "${{ steps.decision.outputs.mode }}" in
            hebdo) ARGS="--hebdo" ;;
            completer) ARGS="--completer" ;;
            *) ARGS="" ;;
          esac
          echo "Lancement : python orchestrateur.py $ARGS"
          python orchestrateur.py $ARGS
        # Le commit + push de docs/data, data/rapports, data/cache et data/hebdo
        # est fait par le pipeline lui-même (core/publication_web.py) quand
        # GITHUB_ACTIONS=true et publication_web.git_push = auto.
