<title>Trading baby Documentaire des marchés</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>

/* Layout : en-tête collant (marque, sessions, onglets), puis un écran par onglet, cartes posées sur un fond légèrement teinté d'encre bleue. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#0D1626; --ink-2:#364153; --muted:#677286; --line:#DDE2EA; --line-2:#C9D0DB;
  --accent:#2F55D4; --accent-soft:#E6ECFD; --up:#0E8A5A; --up-soft:#DDF3E9; --down:#C23B32; --down-soft:#FBE4E1; --warn:#A86A00; --warn-soft:#FBF0D9;
  --c1:#3B5BDB; --c2:#1098AD; --c3:#E67700; --c4:#9C36B5;
  --shadow:0 1px 2px rgba(13,22,38,.05),0 8px 24px -12px rgba(13,22,38,.12);
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:14px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06080C; --surface:#0D1119; --surface-2:#121825; --ink:#E8ECF4; --ink-2:#BCC4D2; --muted:#848FA3; --line:#1C2330; --line-2:#2A3343;
  --accent:#8AA4FF; --accent-soft:#18223F; --up:#43D39E; --up-soft:#0F2A20; --down:#FF7F73; --down-soft:#2D1513; --warn:#F2BE5C; --warn-soft:#2B2210;
  --c1:#5C7CFA; --c2:#1CA3B8; --c3:#D17A0A; --c4:#B65BD6; --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 32px -16px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06080C; --surface:#0D1119; --surface-2:#121825; --ink:#E8ECF4; --ink-2:#BCC4D2; --muted:#848FA3; --line:#1C2330; --line-2:#2A3343;
  --accent:#8AA4FF; --accent-soft:#18223F; --up:#43D39E; --up-soft:#0F2A20; --down:#FF7F73; --down-soft:#2D1513; --warn:#F2BE5C; --warn-soft:#2B2210;
  --c1:#5C7CFA; --c2:#1CA3B8; --c3:#D17A0A; --c4:#B65BD6; --shadow:0 1px 0 rgba(255,255,255,.03),0 12px 32px -16px rgba(0,0,0,.8); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* En-tête */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:600;font-size:23px;letter-spacing:-.01em}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sessions{display:flex;flex-direction:column;gap:4px;min-width:230px;flex:0 1 300px}
.sess-bar{position:relative;height:22px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.sess{position:absolute;top:3px;bottom:3px;border-radius:4px;font-size:10px;font-weight:600;display:flex;align-items:center;padding-left:6px;color:var(--ink-2);white-space:nowrap;overflow:hidden}
.sess.on{color:var(--ink)}
.sess-now{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.sess-cap{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ctrls{display:flex;gap:8px;align-items:center}
.switch{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.switch i{width:30px;height:18px;border-radius:999px;background:var(--line-2);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.switch[aria-pressed="true"] i{background:var(--accent)}
.switch[aria-pressed="true"] i::after{transform:translateX(12px)}
.iconbtn{width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:17px;height:17px}
nav.tabs{display:flex;gap:2px;position:relative;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:none;padding:12px 14px 14px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-ink{position:absolute;bottom:0;height:2px;background:var(--ink);border-radius:2px;transition:left .35s var(--ease),width .35s var(--ease)}

/* Écrans */
main{padding-block:28px 64px}
.screen{display:none;flex-direction:column;gap:22px}
.screen.on{display:flex;animation:in .38s var(--ease)}
@keyframes in{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.on{animation:none}.tab-ink,.switch i::after{transition:none}}
[data-vue="essentielle"] .full{display:none!important}
.eyebrow{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:500;font-size:26px;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head p{margin:0;color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:14px}
.muted{color:var(--muted)}
.src{font-size:11.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up);border-color:transparent}
.chip.dn{background:var(--down-soft);color:var(--down);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pos{color:var(--up)} .neg{color:var(--down)}
.note-ex{font-size:12px;color:var(--warn);font-weight:600}

/* Synthèse */
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:0;overflow:hidden}
.hero-main{padding:30px 32px;display:flex;flex-direction:column;gap:14px}
.hero-main h1{font-family:var(--f-display);font-weight:500;font-size:clamp(38px,5.2vw,60px);line-height:1.02;letter-spacing:-.02em}
.hero-main p{margin:0;font-size:17px;color:var(--ink-2);max-width:62ch}
.hero-side{background:var(--surface-2);border-left:1px solid var(--line);padding:26px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.ring{display:flex;align-items:center;gap:18px}
.ring svg{width:116px;height:116px;flex:none}
.ring b{font-family:var(--f-display);font-size:30px;font-weight:500}
.meter{display:flex;gap:4px}.meter i{width:26px;height:6px;border-radius:3px;background:var(--line-2)}.meter i.on{background:var(--accent)}
.ess{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.ess div{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ess span{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ess p{margin:0;font-size:14.5px;line-height:1.45}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.scen{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-top:1px solid var(--line)}
.scen:first-of-type{border-top:0}
.scen-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.scen-top b{font-weight:600;font-size:15px}
.scen-top span{font-family:var(--f-display);font-size:22px}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:8px;border-radius:3px;background:var(--line)}
.segs i.ok{background:var(--accent)}
.segs i.nd{background:repeating-linear-gradient(135deg,var(--line-2) 0 2px,transparent 2px 5px)}
.conds{display:none;margin:0;padding:0;list-style:none;font-size:13px;color:var(--ink-2);gap:4px;flex-direction:column}
.scen.open .conds{display:flex}
.conds li{display:flex;gap:8px}
.conds em{font-style:normal;font-weight:700;width:14px;flex:none}
.scen button.more{align-self:flex-start;border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;padding:0}
.wl-row{display:grid;grid-template-columns:28px 92px minmax(0,1fr) 54px;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.wl-row:hover{background:var(--surface-2)}
.wl-row .rk{font-family:var(--f-display);font-size:20px;color:var(--muted)}
.wl-row b{font-size:15px}
.stack{display:flex;gap:2px;height:10px}
.stack i{height:100%;border-radius:3px}
.wl-detail{display:none;padding:0 18px 14px 58px;font-size:13.5px;color:var(--ink-2);gap:8px;flex-direction:column}
.wl-detail.open{display:flex}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
.meca{display:flex;flex-wrap:wrap;gap:8px}
.conclu{font-family:var(--f-display);font-size:20px;line-height:1.45;margin:0;max-width:70ch}

/* Tableau de bord */
.tiles{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{padding:16px 16px 10px;display:flex;flex-direction:column;gap:4px;transition:transform .2s var(--ease),border-color .2s}
.tile:hover{transform:translateY(-2px);border-color:var(--line-2)}
.tile .lbl{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{font-size:26px;font-weight:600;letter-spacing:-.01em}
.tile .chg{display:flex;gap:10px;font-size:13px;font-weight:600}
.tile .chg span:last-child{color:var(--muted);font-weight:500}
.tile svg{width:100%;height:46px;display:block;margin-top:6px}
.tile .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.grp{font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.scroll{overflow-x:auto}
table.mx{border-collapse:separate;border-spacing:0;width:100%;min-width:860px;font-size:14px}
.mx th,.mx td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.mx thead th{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;background:var(--surface);position:sticky;top:0}
.mx th:first-child,.mx td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:600;z-index:1}
.mx tbody tr:hover td{background:var(--surface-2)}
.mx td small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.mx .s{font-size:11px;margin-left:4px}
.bcs{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.bc{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.bc b{font-size:22px;font-weight:600}
.bc .who{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted)}

/* Devises */
.dvs{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.dv{display:flex;flex-direction:column}
.dv-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px;gap:10px}
.dv-head .code{font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1}
.dv-head .nm{font-size:13px;color:var(--muted)}
.dv-px{padding:0 20px;display:flex;gap:10px;align-items:baseline}
.dv-px b{font-size:20px;font-weight:600}
.chart{height:170px;margin:8px 8px 0;position:relative}
.dv-body{padding:14px 20px 18px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);margin-top:8px;font-size:13.5px}
.kv{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 12px}
.kv span:nth-child(odd){color:var(--muted)}
.corr{position:relative;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);margin-top:6px}
.corr::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-2)}
.corr i{position:absolute;top:0;bottom:0;border-radius:3px}
.ancs{display:flex;flex-wrap:wrap;gap:6px}

/* Agenda */
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.day{flex:0 0 auto;min-width:96px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .2s,background .2s}
.day:hover{border-color:var(--line-2)}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.day .dn{font-size:12px;color:var(--muted);font-weight:600;text-transform:capitalize}
.day .dd{font-family:var(--f-display);font-size:24px;line-height:1}
.day .bars{display:flex;gap:2px;align-items:flex-end;height:14px}
.day .bars i{width:4px;border-radius:1px;background:var(--line-2)}
.day .bars i.f{background:var(--down)}
.day.today .dn::after{content:" · aujourd'hui";color:var(--accent)}
.ag{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
.ev{display:grid;grid-template-columns:52px 50px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .h{font-weight:600}
.cur{display:inline-grid;place-items:center;height:24px;border-radius:6px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.ev .t{display:flex;flex-direction:column;min-width:0}
.ev .t b{font-weight:600;font-size:14.5px}
.ev .t small{color:var(--muted);font-size:12.5px}
.imp{display:flex;gap:3px}.imp i{width:6px;height:14px;border-radius:2px;background:var(--line-2)}
.imp.fort i{background:var(--down)}.imp.moyen i.on{background:var(--warn)}.imp.faible i.on{background:var(--muted)}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.filt{display:flex;gap:8px;flex-wrap:wrap}

/* Engrenages */
.th-list{display:flex;flex-direction:column}
.th{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:16px;align-items:center;padding:13px 20px;border-top:1px solid var(--line)}
.th:first-child{border-top:0}
.th .nm b{display:block;font-size:14.5px}
.th .nm small{color:var(--muted);font-size:12px}
.track{position:relative;height:30px}
.track .rail{position:absolute;left:0;right:0;top:13px;height:4px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.track .zone{position:absolute;top:10px;height:10px;border-radius:5px;background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--accent) 45%,transparent)}
.track .mk{position:absolute;top:6px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);box-shadow:var(--shadow);transition:left .6s var(--ease)}
.track .v{position:absolute;top:-6px;transform:translateX(-50%);font-size:11.5px;font-weight:700;white-space:nowrap}
.th .st{justify-self:end}
.fil{display:grid;gap:3px;min-width:640px}
.fil .lab{font-size:12.5px;font-weight:600;color:var(--ink-2);padding-right:8px;white-space:nowrap;align-self:center}
.fil i{height:22px;border-radius:4px;background:var(--surface-2)}
.fil i.up{background:var(--up)} .fil i.dn{background:var(--down)} .fil i.nd{background:var(--line-2)}
.fil i.x{background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 5px)}
.fil .d{font-size:10.5px;color:var(--muted);text-align:center}
.engs{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.eng{padding:18px 18px 12px;display:flex;flex-direction:column;gap:10px}
.eng-h{display:flex;gap:10px;align-items:baseline}
.eng-h span{font-family:var(--f-display);font-size:26px;color:var(--muted);line-height:1}
.mini{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.mini .l{font-size:12.5px;color:var(--muted);line-height:1.3}
.mini .v{font-size:16px;font-weight:600}
.mini .v small{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
.mini svg{width:84px;height:30px}

/* Journal */
.jr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .hd{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:4px 6px}
.cell{min-height:86px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px;display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;transition:border-color .2s}
.cell:hover{border-color:var(--line-2)}
.cell.blank{background:transparent;border:0;cursor:default}
.cell.w{background:var(--up-soft)} .cell.l{background:var(--down-soft)}
.cell[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.cell .n{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.cell .p{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .r{margin-top:auto;font-size:13px;font-weight:700}
.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{padding:14px 16px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:600}
.steps{display:flex;flex-direction:column;gap:2px;counter-reset:s}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;padding:10px 0;align-items:start;cursor:pointer;border:0;background:none;text-align:left}
.step i{counter-increment:s;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.step i::before{content:counter(s)}
.step b{font-size:14px;font-weight:600;display:block}
.step small{color:var(--muted);font-size:12.5px}
.step[aria-current="step"] i{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.step.done i{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

/* Ajouts V7.2 : sections riches */
.kicker{display:flex;align-items:center;gap:10px}

  <span class="small">Maquette V13 · données réelles du pipeline au ${ddm(D.date)} · les récits des chapitres 1, 2, 3 et 5 montrent la profondeur visée ; en production, chaque chapitre est rédigé par le modèle à partir des faits Python, avec contrôle des chiffres. Aide à la décision, aucun ordre d'achat ou de vente.</span></section>`;
$('#doc').innerHTML = html;
const CS = [...document.querySelectorAll('.chap')];
$('#toc').innerHTML = CS.map(c => { const k = c.id.slice(1), m = D.mot[k]; return `<a href="#${c.id}"><span class="n">${k}</span><span>${esc(c.dataset.t)}${m ? `<span class="st ${m.etat.code === 'franchi' ? 'pos' : m.etat.code === 'proche' ? '' : 'muted'}" style="${m.etat.code === 'proche' ? 'color:var(--warn)' : ''}">${m.etat.etat}</span>` : ''}</span></a>`; }).join('') + '<div class="bar"><i id="bar"></i></div>';
function spy() { let cur = 0; CS.forEach((c, i) => { if (c.getBoundingClientRect().top < 140) cur = i; }); document.querySelectorAll('#toc a').forEach((a, i) => a.classList.toggle('on', i === cur)); const h = document.documentElement; $('#bar').style.width = Math.round(h.scrollTop / Math.max(1, h.scrollHeight - innerHeight) * 100) + '%'; }
addEventListener('scroll', spy, { passive: true }); spy();
/* graphiques */
let charts = [];
function draw() {
  charts.forEach(c => c.remove()); charts = [];
  document.querySelectorAll('.ch').forEach(el => {
    const s = S[el.dataset.s], d = +el.dataset.d; el.innerHTML = '';
    if (!window.LightweightCharts) { el.innerHTML = spark(s.map(p => p[1]), 600, 200, css('--accent'), true).replace('<svg', '<svg style="width:100%;height:100%"'); return; }
    const c = LightweightCharts.createChart(el, { autoSize: true, localization: { locale: 'fr-FR', dateFormat: 'dd/MM/yy', priceFormatter: v => v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d }) },
      layout: { attributionLogo: false, background: { color: 'transparent' }, textColor: css('--muted'), fontFamily: '"Instrument Sans", -apple-system, Segoe UI, sans-serif', fontSize: 11 },
      grid: { vertLines: { visible: false }, horzLines: { color: css('--line') } }, rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false },
      crosshair: { vertLine: { labelBackgroundColor: css('--ink') }, horzLine: { labelBackgroundColor: css('--ink') } }, handleScroll: false, handleScale: false });
    const a = css('--accent'); const se = c.addAreaSeries({ lineColor: a, topColor: a + '40', bottomColor: a + '00', lineWidth: 2, priceLineVisible: false });
    se.setData(s.map(p => ({ time: p[0], value: p[1] }))); c.timeScale().fitContent(); charts.push(c);
  });
}
draw();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
